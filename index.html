<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pixelart_3d</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="./src/ui/ui.css">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="boot" class="boot">Cargando…</div>
  <script>
    // Diagnóstico de arranque: si falla la carga de un módulo o un shader, se muestra el
    // error en pantalla en lugar de quedarse en negro. main.js quita el aviso al terminar.
    (function () {
      function fail(message) {
        var boot = document.getElementById('boot');
        if (!boot) {
          boot = document.createElement('div');
          boot.id = 'boot';
          boot.className = 'boot';
          document.body.appendChild(boot);
        }
        boot.classList.add('boot--error');
        boot.textContent = 'Error al cargar el juego:\n' + message +
          '\n\nPrueba a recargar sin caché (Ctrl+Shift+R) y a servir la carpeta con python3 serve.py.';
      }
      window.__bootError = fail;
      if (location.protocol === 'file:') fail('los módulos no cargan desde file://; abre http://localhost:8080 con un servidor local.');
      window.addEventListener('error', function (event) {
        if (event instanceof ErrorEvent) fail(event.message + (event.filename ? '\n' + event.filename + ':' + event.lineno : ''));
        else if (event.target && event.target.tagName === 'SCRIPT') fail('no se pudo descargar un módulo del juego (' + (event.target.src || 'script') + ' o sus dependencias) o Three.js desde el CDN.');
      }, true);
      window.addEventListener('unhandledrejection', function (event) { fail(String(event.reason)); });
    })();
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
